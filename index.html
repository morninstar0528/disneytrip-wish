<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#15172e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Disney Journey">
  <title>The Disney journey continues.</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="round-control tactile-control" id="back-button" type="button" aria-label="回到上一頁">‹</button>
      <div class="brand"><b>The Disney journey continues.</b><small>美東美西，玩到美叮美噹 · <span id="sync-state">離線可用</span></small></div>
      <span class="mouse-mark" aria-hidden="true"></span>
    </header>
    <main id="app" class="content"></main>
    <nav class="tabbar" aria-label="主要工具列">
      <button data-view="transport" type="button"><span>✦</span><small>交通</small></button>
      <button data-view="map" type="button"><span>⌖</span><small>地圖</small></button>
      <button class="mouse-menu" id="menu-button" type="button" aria-label="開啟功能選單"><span class="mouse-face" aria-hidden="true"></span><small>選單</small></button>
      <button data-view="stays" type="button"><span>⌂</span><small>住宿</small></button>
      <button data-view="expenses" type="button"><span>◌</span><small>花費</small></button>
    </nav>
  </div>
  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-panel">
      <div class="drawer-head"><div class="mini-mark">●</div><div><b>Disney Journey</b><small>功能頁簽</small></div><button class="round-control close-drawer" type="button" aria-label="關閉選單">×</button></div>
      <div class="drawer-label">探索旅程</div>
      <button data-view="itinerary" type="button">① 每日行程 <small>Daily Schedule</small></button>
      <button data-view="cruise" type="button">② 許願號 <small>Disney Wish</small></button>
      <button data-view="epcot" type="button">③ 新世紀樂園 <small>EPCOT</small></button>
      <button data-view="disneyland" type="button">④ 加州迪士尼 <small>Disneyland Park</small></button>
      <div class="drawer-label">私人資訊</div>
      <button id="vault-entry" class="vault-entry" type="button">⑤ 重要資訊 <small>Personal info.</small><span>›</span></button>
      <button data-view="contacts" type="button">⑥ 聯絡資訊 <small>Contacts</small></button>
      <p class="drawer-foot">所有圖片與圖像按鈕均附說明與編號，方便後續替換素材。</p>
    </div>
  </aside>
  <div id="sheet-root"></div><div id="toast" role="status"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
