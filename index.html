<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e72638"><meta name="apple-mobile-web-app-capable" content="yes">
  <title>Disney Travel Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar"><button class="icon-button" id="menu-button" aria-label="選單">☰</button><div><b>Disney Travel Planner</b><small id="sync-state">準備連線</small></div><button class="share-button" id="share-button">分享</button></header>
    <main id="app" class="content"></main>
    <nav class="tabbar"><button data-view="itinerary">✦<span>行程</span></button><button data-view="cruise">⚓<span>Wish</span></button><button data-view="epcot">◎<span>EPCOT</span></button></nav>
  </div>
  <aside id="drawer" class="drawer" aria-hidden="true"><div class="drawer-panel"><div class="drawer-head"><b>米奇的旅程</b><button class="icon-button close-drawer">×</button></div><button data-view="itinerary">✦ 行程與待辦</button><button data-view="cruise">⚓ Disney Wish</button><button data-view="epcot">◎ EPCOT</button><hr><button id="vault-entry" class="vault-entry">🔒 保險箱 <span>›</span></button><button id="settings-entry">⚙️ 設定</button></div></aside>
  <div id="sheet-root"></div><div id="toast" role="status"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
